<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Romantic Jacuzzi 1BHK Candolim | Mirashya UG10 - Airbnb</title>
    <meta name="description" content="Stay in this cozy 1BHK serviced apartment in Candolim, Goa with private jacuzzi, pool access, WiFi, and air conditioning." />
    <link rel="icon" type="image/x-icon" href="https://a0.muscache.com/airbnb/static/logotype_favicon_transparent-3f268e046da82135f633cca009b8f404.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script src="/axe.min.js"></script>
    <script>
      window.runAxeAudit = function() {
        if (window.axe) {
          window.axe.run(document, { runOnly: { type: 'tag', values: ['wcag2a', 'wcag2aa', 'wcag21a', 'wcag21aa'] } }).then(function(results) {
            window.__axeResults = results;
            var el = document.createElement('div');
            el.id = 'axe-report-container';
            el.setAttribute('data-violations', JSON.stringify(results.violations));
            el.setAttribute('data-passes', results.passes.length);
            el.innerText = 'AXE_VIOLATIONS_COUNT:' + results.violations.length + ';AXE_PASSES_COUNT:' + results.passes.length;
            document.body.appendChild(el);
          }).catch(function(err) {
            console.error('Axe run error:', err);
          });
        }
      };
      window.addEventListener('load', function() {
        setTimeout(window.runAxeAudit, 1500);
      });
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
